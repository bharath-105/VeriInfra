# Mosquitto MQTT Broker Configuration for Local VeriInfra Gateway

listener 1883 0.0.0.0
allow_anonymous true

# Persistence setup
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

# Enable WebSocket listener for live React/Web dashboards on port 9001
listener 9001 0.0.0.0
protocol websockets
